<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6f1"/>
      <stop offset="1" stop-color="#f0ddd2"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c6a15b"/>
      <stop offset="0.5" stop-color="#f3e2b8"/>
      <stop offset="1" stop-color="#a68545"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#6a463c" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g filter="url(#soft)" transform="rotate(-18 400 420)">
    <rect x="346" y="180" width="108" height="70" rx="16" fill="#d7a394"/>
    <rect x="346" y="240" width="108" height="360" rx="20" fill="url(#gold)"/>
    <text x="400" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5c3a32" transform="rotate(90 400 430)">Glowora</text>
  </g>
</svg>
